; PushAside - Data/SKSE/Plugins/PushAside.ini
; Delete this file to use the compiled-in defaults; every value below is exactly
; the compiled-in default, so an unmodified file changes nothing.
;
; A malformed value (not a number, trailing text) is logged and the compiled-in
; default is kept, rather than silently becoming 0.

[General]
; Master switch. 0 installs nothing at all.
bEnabled=1

[Listener]
; Path 1 detection: our listener's CharacterInteractionCallback on the player proxy.
bUseCharacterInteraction=1
; Path 2: our listener's ObjectInteractionCallback (corpses, items, ragdolls).
bUseObjectInteraction=1
; Secondary Path-1 detection inside the listener's ProcessConstraintsCallback
; (manifold scan). CharacterInteractionCallback never fires on the player's
; proxy (in-game evidence 2026-09), so the scan was the original fallback; the
; bump-record path below is now primary and this stays as a secondary path.
; Its leading-proxy ABI is self-checked on live data: N consecutive violations
; disable the scan and mark health DEGRADED.
bUseManifoldScan=1
; Primary Path-1 detection: the engine's own bump record on the player's
; controller (bumpedCharCollisionObject). The main thread resolves the bumped
; rigid body to a character's proxy and hands it to the physics thread, which
; drives the existing character-vs-character model with the shove axis taken
; from the two positions. The manifold scan above stays as a secondary path.
bUseBumpDetection=1
; Escalations (MinHook detours), each verified against the committed table first.
; 0 = no detour is installed at all, which is the default and the supported mode.
bUseEscalationHooks=0
; E1: target-side pre-solve injection, so a push coasts after the contact breaks.
bTargetSideInjection=0

[Hooks]
; Verify every escalation target against the committed table for this exact game
; build before installing it; a mismatch refuses that hook and reports DEGRADED
; rather than patching an address we cannot name. Leave ON.
bVerifyTargets=1

[Physics]
; --- Approach A: the proxy's own knobs (rigid bodies only) ---
; characterStrength (+0xBC): max constant force imparted onto moving objects.
; Skyrim never sets it (engine default FLT_MAX = uncapped), so -1 now DERIVES it
; from the player's race mass, level and physical skills (see fStrength* below).
; Any value >= 0 is an explicit override used verbatim. Try 8000 for a fixed value.
fCharacterStrength=-1
; characterMass (+0xC0): downward force on bodies underfoot only. -1 leaves vanilla.
fCharacterMass=-1

; --- character-strength derivation (only when fCharacterStrength < 0) ---
; Havok's CharacterInteractionDemo uses m_characterStrength = 5000; that is the base.
; P = (1 + fStrengthLevelGain * (level - 1)) * (1 + fStrengthSkillGain * skill01)
;     / (1 + fStrengthSkillGain * 0.15)
; characterStrength = fStrengthBase * P * (raceBaseMass / fStrengthReferenceMass)
; clamped to [fStrengthMin, fStrengthMax].
; TESRace::data.baseMass is a RELATIVE multiplier (~1.0 for humanoids), not kg;
; fStrengthReferenceMass is therefore 1.0 so the anchors below hold for a normal
; race and a race with baseMass > 1 (giant, dragon) scales strength up.
; Fitted anchors: L1/skill0.15 -> 5000, L50/skill0.80 -> 30000,
; L252/skill1.00 -> ~133000.
fStrengthBase=5000
fStrengthReferenceMass=1.0
fStrengthLevelGain=0.05
fStrengthSkillGain=1.371
fStrengthMin=500
fStrengthMax=200000
; Effective player mass contested by the push model: fPlayerMass * P^fMassPowerExponent.
; 100 at base, ~350 at L50/skill0.80, ~1000 at the cap, so a maxed player contests
; dragon-scale mass instead of being mass-ratio curbstomped.
fMassPowerExponent=0.7
; Physical-skill weights (One-Handed, Two-Handed, Block, Heavy Armor, Archery).
; Each skill counts as actorValue/100 clamped to [0,1]; the weights are normalised
; by their sum, so only their ratios matter.
fStrengthWeightOneHanded=0.30
fStrengthWeightTwoHanded=0.25
fStrengthWeightBlock=0.20
fStrengthWeightHeavyArmor=0.15
fStrengthWeightArchery=0.10

; --- mass model (ratios matter, absolute values do not) ---
fPlayerMass=100
fDefaultCharacterMass=80
fMassRatioMax=2.0
fHeavyMassRatio=2.5
fHeavyScale=0.25
fHeavyMinSpeed=60

; --- Path 1: character vs character ---
fMinRelSpeed=20
fRestitution=0.15
fPushScale=1.0
fMaxDeltaV=250
fMaxInjectedSpeed=350
; 1/s decay of the per-target buffer. 0 = never decays (do not use).
fPushDamping=6
fPushCooldownMs=200
fMaxPushDurationMs=600
; Fraction of the push the pusher loses. 0 for the player, 0.15 for NPC vs NPC.
fReactionOnPusher=0

; --- state scales ---
fCombatScale=0.5
fOutOfCombatScale=1.0
fSwimScale=0.35
fAirborneScale=0.5
fUnknownTargetScale=0.5
; Reserved: the injected direction is horizontal (z = 0) in v1.
fLift=0
fStaggerCooldownMs=1500
fStaggerDeltaV=120
fStaggerMassExponent=0.5
bStaggerOutOfCombat=0

; --- Path 2: character vs rigid body ---
; 0 = scale the engine's own impulse (safe). 1 = recompute it from relative
; velocity and mass (needs the normal sign pinned from the log first).
bObjectCustomImpulse=0
fObjectShoveScale=1.0
fObjectRestitution=0.2
; 0 = uncapped (characterStrength still clamps).
fMaxObjectImpulse=0

[Policy]
; Only meaningful if escalation hooks are enabled: v1's listener cannot see
; NPC-vs-NPC or NPC-vs-player contacts at all.
bNpcVsNpc=0
bPlayerAsTarget=0
bDisableDuringDialogue=1
; Gate 19 kill switches.
bDisableInCombat=0
bDisableWhileSwimming=0

[Budget]
uMaxInteractionsPerFrame=32
uRegistryCapacity=512
fRegistryRefreshSec=1.0

[Diagnostics]
bDebugLog=0
uDebugLogMaxPerSec=32
fCalibrationLogAfterSec=5
; Instrumentation side channel: append rich CSV rows to PushAside.trace.
bTrace=0
