fCharacterMass=-1
fPlayerMass=100
fDefaultCharacterMass=80
fMassRatioMax=2.0
fHeavyMassRatio=2.5
fHeavyScale=0.25
fHeavyMinSpeed=60
fMinRelSpeed=20
fRestitution=0.15
fPushScale=1.0
fMaxDeltaV=250
fMaxInjectedSpeed=350
fPushDamping=6
fPushCooldownMs=200
fMaxPushDurationMs=600
fReactionOnPusher=0
fCombatScale=0.5
fOutOfCombatScale=1.0
fSwimScale=0.35
fAirborneScale=0.5
fUnknownTargetScale=0.5
fLift=0
fStaggerCooldownMs=1500
fStaggerDeltaV=120
fStaggerMassExponent=0.5
bStaggerOutOfCombat=0
bObjectCustomImpulse=0
fObjectShoveScale=1.0
fObjectRestitution=0.2
